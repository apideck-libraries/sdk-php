name: Publish
permissions:
  checks: write
  contents: write
  pull-requests: write
  statuses: write
  id-token: write
"on":
  push:
    branches:
      - main
    paths:
      - .speakeasy/gen.lock
  workflow_dispatch: {}
jobs:
  publish:
    uses: speakeasy-api/sdk-generation-action/.github/workflows/sdk-publish.yaml@v15
    with:
      target: apideck
    secrets:
      github_access_token: ${{ secrets.GITHUB_TOKEN }}
      packagist_username: ${{ secrets.PACKAGIST_USERNAME }}
      packagist_token: ${{ secrets.PACKAGIST_TOKEN }}
      speakeasy_api_key: ${{ secrets.SPEAKEASY_API_KEY }}

  verify-published:
    name: Verify tag reached Packagist
    needs: publish
    if: always() && needs.publish.result != 'success'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check the released tag has a package on Packagist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          VERSION=$(git describe --tags --abbrev=0 | sed 's/^v//')
          for _ in 1 2 3; do
            CODE=$(curl -sS https://repo.packagist.org/p2/apideck-libraries/sdk-php.json | grep -qF "\"version\":\"v$VERSION\"" && echo 200 || echo 404)
            [ "$CODE" = 200 ] && break
            sleep 60
          done
          if [ "$CODE" = 200 ]; then
            echo "v$VERSION is on Packagist. The run failed for another reason."
            exit 0
          fi
          echo "::error::v$VERSION is tagged and GitHub-released but absent from Packagist (HTTP $CODE)"
          TITLE="Release v$VERSION is tagged but not published to Packagist"
          if ! gh issue list --state open --json title -q '.[].title' | grep -qxF "$TITLE"; then
            gh issue create --title "$TITLE" --body "Tag \`v$VERSION\` and its GitHub Release exist, but the package never reached Packagist - consumers see a version they cannot install. Most likely an expired publishing credential (context: apideck-io/unify#12544). Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
          exit 1
